name: Release

# Publishing only happens from a v* tag. Tags and main are protected by rulesets (owner only),
# and the publish job runs in the "marketplace" environment, which requires the owner's approval
# and is the only place where publishing credentials are available.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npx vsce package --no-dependencies --out star-ui-kilo.vsix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: star-ui-kilo-vsix
          path: star-ui-kilo.vsix
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC token for Microsoft Entra ID (no stored secret)
    env:
      USE_ENTRA: ${{ vars.AZURE_CLIENT_ID != '' }}
      HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
      HAS_OVSX_PAT: ${{ secrets.OVSX_PAT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: star-ui-kilo-vsix

      # Preferred: Microsoft Entra ID workload identity federation (see RELEASING.md).
      - name: Azure login (OIDC)
        if: env.USE_ENTRA == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: ${{ vars.AZURE_SUBSCRIPTION_ID == '' }}
      - name: Publish to the VS Code Marketplace (Entra ID)
        if: env.USE_ENTRA == 'true'
        run: npx vsce publish --azure-credential --packagePath star-ui-kilo.vsix

      # Fallback: personal access token stored as an environment secret (works until Dec 1, 2026).
      - name: Publish to the VS Code Marketplace (PAT)
        if: env.USE_ENTRA != 'true' && env.HAS_VSCE_PAT == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath star-ui-kilo.vsix

      - name: No Marketplace credentials
        if: env.USE_ENTRA != 'true' && env.HAS_VSCE_PAT != 'true'
        run: echo "::warning::No Marketplace credentials configured in the marketplace environment; skipping Marketplace publish."

      # Open VSX (Cursor, VSCodium, Windsurf, and private mirrors).
      # Preferred: trusted publishing, the job's OIDC token is exchanged for a short-lived token.
      - name: Publish to Open VSX (trusted publishing)
        if: vars.OPENVSX_TRUSTED_PUBLISHING == 'true'
        run: npx --yes ovsx@1.2.0 publish --packagePath star-ui-kilo.vsix --trusted-publishing --skip-duplicate
      - name: Publish to Open VSX (token)
        if: vars.OPENVSX_TRUSTED_PUBLISHING != 'true' && env.HAS_OVSX_PAT == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.2.0 publish --packagePath star-ui-kilo.vsix --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" star-ui-kilo.vsix --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
